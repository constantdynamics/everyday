name: Bouw APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bouw:
    name: Debug-APK bouwen en controleren
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle klaarzetten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bouwen
        run: ./gradlew --no-daemon assembleDebug

      - name: Samengevoegde manifest controleren
        run: |
          set -e
          manifest=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)
          if [ -z "$manifest" ]; then
            manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*' | head -1)
          fi
          echo "Manifest: $manifest"
          if grep -qE 'android\.permission\.(INTERNET|POST_NOTIFICATIONS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_NETWORK_STATE)' "$manifest"; then
            echo "FOUT: de samengevoegde manifest bevat een verboden permissie:"
            grep -E 'uses-permission' "$manifest"
            exit 1
          fi
          echo "OK: alleen deze permissies staan erin:"
          grep -E 'uses-permission' "$manifest" || echo "(geen)"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: everyday-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Room-schema bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-room-schema
          path: app/schemas/**/*.json
          if-no-files-found: warn

      # Als laatste stap, zodat de uitvoer onderaan de log staat en het schema
      # daar in zijn geheel uit te halen is.
      - name: Geëxporteerd Room-schema controleren en tonen
        run: |
          set -e
          schema_aanwezig() {
            [ -d app/schemas ] && [ -n "$(find app/schemas -name '*.json' -print -quit)" ]
          }
          if ! schema_aanwezig; then
            # Bij een build die grotendeels uit de cache komt draait KSP niet en
            # wordt het schema niet opnieuw weggeschreven. Dan forceren we het.
            echo "Geen schema na deze build; KSP wordt geforceerd opnieuw gedraaid."
            ./gradlew --no-daemon assembleDebug --rerun-tasks > /dev/null
          fi
          if ! schema_aanwezig; then
            echo "FOUT: Room heeft geen schema geëxporteerd, terwijl exportSchema aanstaat."
            echo "Zonder geëxporteerd schema zijn latere migraties niet te controleren."
            exit 1
          fi
          # Alleen letten op schema's die al zijn vastgelegd: wijkt het vastgelegde
          # schema af van wat de build oplevert, dan is er iets niet bijgewerkt.
          if [ -n "$(git status --porcelain --untracked-files=no -- app/schemas)" ]; then
            echo "FOUT: het vastgelegde Room-schema loopt achter op wat de build oplevert."
            git status --short -- app/schemas
            exit 1
          fi
          find app/schemas -name '*.json' | sort | while read -r bestand; do
            echo "SCHEMA $bestand ($(wc -c < "$bestand") bytes)"
            # Als één base64-regel, zodat het schema in zijn geheel uit de log te
            # halen is; de blob-opslag van artefacten is niet overal bereikbaar.
            echo "BASE64:$(base64 -w0 "$bestand")"
          done

  release:
    name: Ondertekende release-APK
    runs-on: ubuntu-latest
    needs: bouw
    # Draait alleen als je de keystore als repository-secret hebt gezet; zie README.
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Keystore uitpakken
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EVERYDAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "aanwezig=nee" >> "$GITHUB_OUTPUT"
            echo "Geen keystore-secret gevonden; release-stap wordt overgeslagen."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/everyday.jks"
          echo "aanwezig=ja" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.keystore.outputs.aanwezig == 'ja'
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle klaarzetten
        if: steps.keystore.outputs.aanwezig == 'ja'
        uses: gradle/actions/setup-gradle@v4

      - name: Release-APK bouwen
        if: steps.keystore.outputs.aanwezig == 'ja'
        env:
          EVERYDAY_KEYSTORE_FILE: ${{ runner.temp }}/everyday.jks
          EVERYDAY_KEYSTORE_PASSWORD: ${{ secrets.EVERYDAY_KEYSTORE_PASSWORD }}
          EVERYDAY_KEY_ALIAS: ${{ secrets.EVERYDAY_KEY_ALIAS }}
          EVERYDAY_KEY_PASSWORD: ${{ secrets.EVERYDAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Release-APK bewaren
        if: steps.keystore.outputs.aanwezig == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: everyday-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
