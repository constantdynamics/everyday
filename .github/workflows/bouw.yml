name: Bouwen en testen

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      schermafbeeldingen:
        description: "Schermafbeeldingen vastleggen in docs/schermafbeeldingen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bouw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouw:
    name: Bouwen, unittests en privacycontrole
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle klaarzetten
        uses: gradle/actions/setup-gradle@v5

      # The build makes a throw-away signing key in the runner's home folder. The key
      # that signs the app on the phone only ever exists on the owner's own computer.
      - name: App bouwen (debug en release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Privacycontrole op de APK zelf
        run: |
          bash scripts/controleer-privacy.sh app/build/outputs/apk/release/app-release.apk
          bash scripts/controleer-privacy.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Unittests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Testrapport en schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unittests
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/schermafbeeldingen
          if-no-files-found: warn

      - name: Samenvatting van de tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re
          total = failed = 0
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              text = open(path, encoding='utf-8').read()
              head = re.search(r'<testsuite name="([^"]+)" tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', text)
              if not head:
                  continue
              bad = int(head.group(4)) + int(head.group(5))
              total += int(head.group(2)); failed += bad
              print(f"{head.group(1).split('.')[-1]:<28} {head.group(2):>4} tests, {bad} mislukt")
              for case in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<(failure|error) message="([^"]*)"', text):
                  print(f"    MISLUKT: {case.group(1)}\n      {case.group(3)[:600]}")
          print(f"TOTAAL {total} tests, {failed} mislukt")
          EOF

  toestel:
    name: Tests op een Android-emulator (Android API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Android 14 and Android 16: an established version and a recent one.
        api-level: [34, 36]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle klaarzetten
        uses: gradle/actions/setup-gradle@v5

      - name: Hardwareversnelling voor de emulator aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App en tests bouwen
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      # The real camera screen, the real folder picker and the real video encoder,
      # on an emulated phone with an emulated camera.
      - name: Tests op de emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front emulated
          script: bash scripts/emulatortests.sh

      - name: Resultaten bewaren
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-${{ matrix.api-level }}
          path: |
            app/build/emulator
            app/build/reports/androidTests
          if-no-files-found: warn

  schermafbeeldingen:
    name: Schermafbeeldingen vastleggen
    # Only on request: start the workflow by hand and tick the box.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.schermafbeeldingen
    needs: [bouw, toestel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artefacten

      - name: Verkleinen en vastleggen
        run: |
          set -e
          python3 -m pip install --quiet pillow
          python3 scripts/verklein-schermafbeeldingen.py docs/schermafbeeldingen \
            artefacten/unittests/schermafbeeldingen artefacten/emulator-34/emulator/schermafbeeldingen
          if [ -z "$(git status --porcelain -- docs/schermafbeeldingen)" ]; then
            echo "De schermafbeeldingen zijn ongewijzigd."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schermafbeeldingen
          git commit -m "Schermafbeeldingen bijwerken [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
