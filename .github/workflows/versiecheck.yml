name: Versiecheck

# Draait alleen op verzoek. Drukt af welke stabiele versies van de gebruikte
# onderdelen beschikbaar zijn, zodat bijwerken een bewuste handeling blijft.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versies:
    name: Beschikbare versies
    runs-on: ubuntu-latest
    steps:
      - name: Stabiele en nieuwste versies
        run: |
          toon() {
            versies=$(curl -sL "$1/$2/maven-metadata.xml" \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g')
            stabiel=$(echo "$versies" | grep -viE 'alpha|beta|rc|-dev|-M[0-9]|snapshot' | tail -3 | tr '\n' ' ')
            nieuwste=$(echo "$versies" | tail -1)
            printf '%-46s stabiel: %-34s nieuwste: %s\n' "$(basename "$2")" "$stabiel" "$nieuwste"
          }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/camera/camera-core \
                   androidx/room/room-runtime androidx/navigation/navigation-compose \
                   androidx/lifecycle/lifecycle-runtime-compose androidx/activity/activity-compose \
                   androidx/datastore/datastore-preferences androidx/exifinterface/exifinterface \
                   androidx/core/core-ktx androidx/compose/material3/material3; do
            toon "$G" "$a"
          done
          for a in org/jetbrains/kotlin/kotlin-gradle-plugin \
                   com/google/devtools/ksp/symbol-processing-gradle-plugin \
                   org/jetbrains/kotlinx/kotlinx-coroutines-android; do
            toon "$C" "$a"
          done

      - name: Android SDK op de runner
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | sort -V | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | sort -V | tr '\n' ' ')"
          echo "gradle op runner: $(gradle --version 2>/dev/null | grep -m1 Gradle)"
          echo "java: $(java -version 2>&1 | head -1)"
